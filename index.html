<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>專題報告引導器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* 版面：頂列＋兩欄（章節導覽｜主內容），窄螢幕堆疊 */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --ink:#1A2320; --muted:#5B6863; --line:#D6DEDB;
  --accent:#0D6B5F; --accent-ink:#FFFFFF; --accent-soft:#DDEFEA;
  --warn:#A65A14; --warn-soft:#FBEBD6; --bad:#B3261E; --bad-soft:#FBE3E1; --code:#EDF1EF;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-head:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111715; --surface:#19211E; --ink:#E3EBE7; --muted:#97A59F; --line:#2B3632;
  --accent:#4DBFAC; --accent-ink:#0B1412; --accent-soft:#17332D;
  --warn:#E3A15A; --warn-soft:#382715; --bad:#F2867C; --bad-soft:#3A1C1A; --code:#0D1210; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;line-height:1.3}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 260px}
.brand h1{font-size:19px}
.brand span{font-size:13px;color:var(--muted)}
.top-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.save{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.banner{background:var(--warn-soft);font-size:14px;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.banner b{color:var(--warn)}

.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;padding:20px max(16px,env(safe-area-inset-left,0px));align-items:start;max-width:1180px;margin:0 auto}
.nav{position:sticky;top:12px;display:flex;flex-direction:column;gap:3px}
.nav button{display:grid;grid-template-columns:2em 1fr auto;align-items:center;gap:6px;text-align:left;border:1px solid transparent;background:none;border-radius:6px;padding:7px 10px;cursor:pointer}
.nav button:hover{background:var(--surface)}
.nav button[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.nav .no{font-family:var(--f-head);font-weight:700;color:var(--accent)}
.nav .nm{font-size:14px;min-width:0}
.nav .st{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .st.ok{color:var(--accent);font-weight:700}
.nav hr{border:0;border-top:1px solid var(--line);margin:6px 0}

.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.ch-head{display:flex;flex-direction:column;gap:6px}
.ch-head .eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.ch-head h2{font-size:28px}
.ch-head p{margin:0;color:var(--muted);max-width:66ch}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.pill.b{background:var(--bad-soft);color:var(--bad)}

.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:12.5px}
.strip div{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);color:var(--muted);line-height:1.4}
.strip div b{display:block;color:var(--ink);font-size:13px}
.strip div.done{border-color:var(--accent);background:var(--accent-soft)}
.strip div.done b{color:var(--accent)}
.next{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:12px 14px}
.next div{flex:1 1 300px;min-width:0}
.next b{color:var(--accent);font-size:15.5px}
.next p{margin:2px 0 0;font-size:13.5px}

.group{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:18px}
.group h3{font-size:18px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.group h3 small{font-family:var(--f-body);font-size:12.5px;font-weight:400;color:var(--muted)}
.mine{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lab{font-weight:700;font-size:14.5px}
.req{color:var(--warn);font-weight:400;font-size:12px;margin-left:6px}
.opt{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.hint{font-size:13px;color:var(--muted);margin:0;max-width:72ch}
.field input,.field select,.field textarea,.card input,.card select,.card textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px 10px;line-height:1.6}
.field textarea{resize:vertical;min-height:64px}
details.ex{font-size:13px;border:1px dashed var(--line);border-radius:6px;padding:4px 10px}
details.ex summary{cursor:pointer;color:var(--accent);font-weight:500}
.ex .g,.ex .x{margin:6px 0;padding:6px 8px;border-radius:4px;white-space:pre-wrap}
.ex .g{background:var(--accent-soft)} .ex .x{background:var(--bad-soft)}
.ex .g b{color:var(--accent)} .ex .x b{color:var(--bad)}
.echo{background:var(--accent-soft);border-radius:6px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap}
.echo b{color:var(--accent)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--bg);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--muted)}
td{border-bottom:1px solid var(--line);padding:2px;vertical-align:top}
tr:last-child td{border-bottom:0}
td textarea,td select{width:100%;min-width:110px;border:0;background:transparent;padding:6px;resize:vertical;min-height:38px;line-height:1.5}
td.tags{min-width:150px;padding:6px;font-size:12.5px}
td.tags label{display:inline-flex;gap:3px;align-items:center;margin:0 8px 2px 0;white-space:nowrap;font-weight:400}
td.no{padding:8px;white-space:nowrap;font-weight:500;color:var(--accent)}
td.del{width:34px;text-align:center}
td.del button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:6px}
td.del button:hover{color:var(--bad)}

.picker{border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.picker summary{cursor:pointer;padding:8px 10px;font-weight:500;color:var(--accent);font-size:13.5px}
.picker ul{list-style:none;margin:0;padding:0 10px 10px;display:flex;flex-direction:column;gap:6px}
.picker li{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:8px 10px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.picker li div{flex:1;min-width:0}
.picker li .ct{color:var(--muted);font-size:12px;word-break:break-all}

.stepcard{border:2px solid var(--accent);background:var(--surface);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:14px}
.stepcard h3{font-size:19px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}
.step>.n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center}
.step.done>.n{background:var(--accent);color:var(--accent-ink)}
.step>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.step h4{font-family:var(--f-body);font-size:15px}
.step textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px 10px;resize:vertical}
.pre{margin:0;background:var(--code);border-radius:6px;padding:12px;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto}
.ro{font-size:12px;font-weight:700;color:var(--muted)}
.lock{background:var(--warn-soft);border-radius:6px;padding:10px 12px;font-size:13.5px}
.lock b{color:var(--warn)}
.lock ul{margin:4px 0 0;padding-left:20px}
.ups{display:flex;flex-direction:column;gap:8px}
.up{border:1px solid var(--warn);background:var(--warn-soft);border-radius:6px;padding:8px 10px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.up .hd{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.up .hd b{color:var(--warn)}
.up .tx{white-space:pre-wrap;background:var(--surface);border-radius:4px;padding:6px 8px}
.up.applied{border-color:var(--accent);background:var(--accent-soft);opacity:.75}
.up.applied .hd b{color:var(--accent)}
.up.skipped{opacity:.5;border-style:dashed;background:transparent}
.notice{border:2px solid var(--warn);background:var(--warn-soft);border-radius:8px;padding:10px 12px;font-size:13.5px}
.notice b{color:var(--warn)}
.chk{border-radius:8px;padding:12px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.chk.block{border:2px solid var(--bad);background:var(--bad-soft)}
.chk.block>b{color:var(--bad)}
.chk.warn{border:2px solid var(--warn);background:var(--warn-soft)}
.chk.warn>b{color:var(--warn)}
.chk ul{margin:0;padding-left:20px}
.toast{font-size:12.5px;color:var(--accent);font-weight:500}
.links a{font-size:13px;color:var(--accent);margin-right:10px}

.card{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px 10px;font-size:13.5px}
.card label{display:flex;flex-direction:column;gap:3px;font-weight:500;font-size:12.5px;color:var(--muted)}
.card .full{grid-column:1/-1}
.card .cite{grid-column:1/-1;background:var(--surface);border-radius:4px;padding:6px 8px;font-size:13px}
.card .cite b{color:var(--accent)}
.stat{display:flex;flex-wrap:wrap;gap:8px}

.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:40px clamp(18px,5vw,64px);font-family:"Noto Serif TC","PMingLiU",serif;line-height:1.9}
.paper h2{font-size:22px;text-align:center;margin:28px 0 14px}
.paper h3{font-size:17px;margin:18px 0 6px}
.paper p{margin:0 0 10px;text-indent:2em;white-space:pre-wrap}
.paper .cover{text-align:center;padding:40px 0 60px;border-bottom:1px dashed #bbb}
.paper .cover .big{font-size:26px;letter-spacing:.3em;margin:18px 0}
.paper .ph{color:#999;font-style:italic;text-indent:0}
.paper .fig{background:#FFF4D6;padding:0 4px;border-radius:3px}
.paper .todo{background:#FCE1DE;padding:0 4px;border-radius:3px}
.paper .tag{font-family:var(--f-body);font-size:12px;color:#A65A14;margin-left:8px}
.paper ul{padding-left:20px}
.paper .ref{text-indent:-2em;padding-left:2em}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--surface);border-radius:10px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px;font-size:12.5px}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{from{box-shadow:0 0 0 5px var(--accent-soft)}to{box-shadow:0 0 0 0 transparent}}

@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .nav{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .nav button{grid-template-columns:auto auto;flex:0 0 auto;border-color:var(--line);background:var(--surface)}
  .nav .st,.nav hr{display:none}
  .strip{grid-template-columns:1fr 1fr}
  .ch-head h2{font-size:23px}
}
.framed .noframe{display:none!important}
.framedonly{display:none}
.framed .framedonly{display:inline}
@media print{
  .top,.banner,.nav,.noprint{display:none!important}
  .layout{display:block;padding:0}
  .paper{border:0;padding:0}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 id="projName">專題報告引導器</h1>
    <span>多媒體遊戲發展與應用系 畢業專題報告（系上 6 章範本）</span>
  </div>
  <span class="save" id="saveState">資料自動存在這台電腦的瀏覽器</span>
  <div class="top-actions">
    <button class="btn" id="btnData">匯出／匯入</button>
    <button class="btn" id="btnSample">看完整範例</button>
    <button class="btn warn" id="btnNew">開始新專題</button>
  </div>
</header>
<div class="banner" id="sampleBanner" hidden>
  <span><b>目前是範例資料：</b>梅莉物語（遊戲組，組員已匿名）。標〔待補〕的地方是刻意留下的缺口。</span>
  <button class="btn sm" id="btnNew2">清空，開始我的專題</button>
</div>

<div class="layout">
  <nav class="nav" id="nav" aria-label="章節"></nav>
  <main class="main" id="main"></main>
</div>

<div class="modal" id="modal" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle">匯出／匯入專題資料</h3>
    <p class="hint">資料只存在這台電腦的瀏覽器。換電腦、備份或交給老師檢閱時，用 JSON 搬移。<b>建議每次寫完都匯出一次備份。</b></p>
    <label class="field"><span class="lab">目前資料（JSON）</span><textarea id="exportBox" readonly></textarea></label>
    <div class="top-actions">
      <button class="btn pri" id="btnCopyJson">複製 JSON</button>
      <button class="btn" id="btnDlJson">下載 .json 檔</button>
      <span class="toast" id="jsonToast"></span>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <label class="field"><span class="lab">匯入：選擇 .json 檔或貼上 JSON</span>
      <input type="file" id="importFile" accept=".json,application/json">
      <textarea id="importBox" placeholder="把先前匯出的 JSON 貼在這裡"></textarea></label>
    <div class="top-actions">
      <button class="btn pri" id="btnImport">匯入並取代目前資料</button>
      <button class="btn" id="btnClose">關閉</button>
      <span class="toast" id="importMsg"></span>
    </div>
  </div>
</div>

<script>
/* ===================== 1. 組別、子類型與老師入門資料 ===================== */
const GROUPS = {
  '遊戲組':['2D 遊戲','3D 遊戲'],
  '多媒體組':['微電影','短影音','紀錄片','2D 動畫','3D 動畫'],
  '網紅直播組':['網紅直播','電競直播'],
  '主視覺組':['主視覺／品牌識別'],
  '其他組':['手繪插畫','AI 插畫']
};
// 子類型 → 領域：決定欄位名稱、說明與勾選項目
const DOMAIN = {'2D 遊戲':'game','3D 遊戲':'game','微電影':'film','短影音':'film','紀錄片':'film','2D 動畫':'anim','3D 動畫':'anim','網紅直播':'live','電競直播':'live','主視覺／品牌識別':'art','手繪插畫':'art','AI 插畫':'art'};

/* ===================== 4. 狀態與儲存 ===================== */
const KEY = 'report-guide-v2';
let state, cur = 'c0';
const blank = () => ({ v:2, isSample:false, values:{ group:'遊戲組', sub:'2D 遊戲' }, srcs:[], raw:{}, body:{}, bodySig:{}, ups:{}, final:{}, read:{}, pre:{}, log:[], abs:'' });
const clone = o => JSON.parse(JSON.stringify(o));
function fix(){ state = Object.assign(blank(), state); ['srcs','log'].forEach(k => { if (!Array.isArray(state[k])) state[k] = []; }); ['raw','body','bodySig','ups','final','read','pre','values'].forEach(k => { state[k] = state[k] || {}; }); }
function load(){
  try { const s = localStorage.getItem(KEY); if (s) state = JSON.parse(s); } catch(e){}
  if (!state) state = blank();
  fix();
  try { cur = localStorage.getItem(KEY + ':cur') || 'c0'; } catch(e){}
}
let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); $('#saveState').textContent = '已自動儲存 ' + new Date().toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit'}); }
    catch(e){ $('#saveState').textContent = '無法自動儲存，請用「匯出」保存資料'; }

}

/* ===================== 5. 工具函式 ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val = id => state.values[id];
const dom = () => DOMAIN[val('sub')] || 'game';
const L = x => x == null ? '' : typeof x === 'string' ? x : (x[dom()] || x.game || '');
const trimEnd = s => String(s || '').trim().replace(/[。．.！!]+$/, '');
const today = () => new Date().toISOString().slice(0, 10);
const optsOf = f => typeof f.opts === 'function' ? f.opts() : (f.opts || []);
const colOpts = col => col.opts || TAGS[dom()];
const shown = f => !f.show || f.show();
function filled(f){
  const v = val(f.id);
  if (f.kind === 'table') return Array.isArray(v) && v.some(r => r.some(x => String(x ?? '').trim()));
  if (f.kind === 'answers') { const n = proveList().length; return n > 0 && (v || []).slice(0, n).filter(a => a && a.r).length === n; }
  return String(v ?? '').trim() !== '';
}
const allFields = c => c.groups.flatMap(g => g.fields).filter(f => f.kind !== 'echo');
function gate(c){ const req = allFields(c).filter(f => f.req && shown(f)); const miss = req.filter(f => !filled(f)); return { done:req.length - miss.length, total:req.length, miss }; }
const label = f => L(f.label);
const shortName = f => label(f).replace(/（[^）]*）/g, '').trim();
const proveList = () => String(val('prove') || '').split('\n').map(s => s.trim()).filter(Boolean);
const chName = c => c.type === 'basic' || c.type === 'pos' ? c.title : '第' + c.no + '章 ' + c.title;
const chIndex = c => ['c1','c2','c3','c4','c5','c6'].indexOf(c.id) + 1;
// 欄位值轉成提示詞用文字；表格轉成「｜」分隔的行
function fieldText(f){
  const v = val(f.id);
  if (f.kind === 'table'){
    if (!filled(f)) return '';
    return f.cols.map(c => c.n).join('｜') + '\n' + v.filter(r => r.some(x => String(x ?? '').trim())).map(r => f.cols.map((_, i) => String(r[i] ?? '').replace(/\n/g, ' ')).join('｜')).join('\n');
  }
  if (f.kind === 'figs') return figList(f.ch).map(x => x.no + '：' + x.name + (x.desc ? '（' + x.desc + '）' : '')).join('\n');
  if (f.kind === 'answers') return answersText();
  return String(v ?? '').trim();
}
function dumpChapter(c){
  return c.groups.map(g => {
    const body = g.fields.filter(f => f.kind !== 'echo' && f.kind !== 'figs' && f.id !== 'vis' && shown(f)).map(f => '【' + shortName(f) + '】\n' + (fieldText(f) || '（未填）')).join('\n\n');
    return body ? '## ' + g.title + '\n' + body : '';
  }).filter(Boolean).join('\n\n');
}
function basics(){
  return '專題名稱：' + (val('title') || '（未填）') + '\n組別：' + (val('group') || '') + '（' + (val('sub') || '') + '）' +

// 簡單指紋：判斷欄位在貼回正文後有沒有再改
function sig(c){ const t = JSON.stringify(allFields(c).map(f => val(f.id) ?? '')); let h = 5381; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return String(h); }

/* ===== 圖表清單：自動編號 圖{章}-{節}-{序} ===== */
function figList(cid){
  const c = chap(cid), secs = c.outline(), rows = val('figs_' + cid) || [], k = chIndex(c), cnt = {};
  return rows.filter(r => String(r[0] || '').trim()).map(r => {
    let s = secs.indexOf(r[2]); if (s < 0) s = 0;
    cnt[s] = (cnt[s] || 0) + 1;
    return { no:'圖' + k + '-' + (s + 1) + '-' + cnt[s], name:String(r[0]).trim(), desc:String(r[1] || '').trim() };
  });
}

/* ===== 我參考的資料：自己找的＋老師清單＋第二章參考作品（自動，C 級） ===== */
function citeOf(s){
  if (s.cite) return s.cite;
  const a = s.author || '〔待補：作者〕', d = s.date || '〔待補：日期〕', t = s.title || '〔待補：標題〕';
  const parts = [a + '（' + d + '）', t];
  if (s.place) parts.push(s.place); else if (!s.url) parts.push('〔待補：出版地〕');
  parts.push(s.pub || '〔待補：出版者或網站名稱〕');
  return parts.join('、') + (s.url ? '，' + s.url + '，檢索日期 ' + (s.retr || today()) : '');
}
const yearOf = s => (String(s.year || s.date || '').match(/\d{4}/) || [''])[0];
function workRows(){ return (val('works') || []).filter(r => String(r[0] || '').trim() && !/〔待補/.test(r[0])); }
function workCite(r){ return (String(r[1] || '').trim() || '〔待補：出品者〕') + '（' + (String(r[2] || '').trim() || '〔待補：年份〕') + '）、' + String(r[0]).trim() + '、' + (String(r[3] || '').trim() || '〔待補：平台〕'); }
function srcStats(){
  const s = state.srcs, ab = s.filter(x => x.lv === 'A' || x.lv === 'B').length, c = s.filter(x => x.lv === 'C').length + workRows().length;
  return { total:s.length + workRows().length, A:s.filter(x => x.lv === 'A').length, B:s.filter(x => x.lv === 'B').length, C:c, ab };
}
function srcBlock(){
  const s = state.srcs;
  if (!s.length) return '（還沒有加入資料。需要引用的地方一律寫【待補：資料】。）';
  return s.map((x, i) => '資料' + (i + 1) + '｜' + x.lv + ' 級｜' + citeOf(x) +
    (x.said ? '\n  這份資料說了什麼：' + x.said : '') + (x.quote ? '\n  可引用的一句：' + x.quote : '') + (x.rel ? '\n  跟我的作品的關係：' + x.rel : '')).join('\n');
}
// （資料3）或（資料1、資料3）→（作者，年份；作者，年份）
function convertCites(t){
  return String(t || '').replace(/（\s*(資料\s*\d+(?:\s*[、，,；;]\s*資料\s*\d+)*)\s*）/g, (m, inner) => {
    const parts = inner.match(/\d+/g).map(n => { const s = state.srcs[+n - 1]; return s ? (s.author ? s.author.split(/[、,，]/)[0] + (/[、,，]/.test(s.author) ? '等' : '') : '〔待補：作者〕') + '，' + (yearOf(s) || '〔待補：年份〕') : '〔錯誤：資料' + n + ' 不存在〕'; });
    return '（' + parts.join('；') + '）';
  });
}

/* ===== 第六章：逐項回應 ===== */
function quoteRows(){ return (val('quotes') || []).map((r, i) => ({ i, who:r[0], where:r[1], said:r[2], pn:r[3] })).filter(q => String(q.said || '').trim()); }
function answersText(){
  const a = val('answers') || [], qs = quoteRows();
  return proveList().map((p, i) => {
    const x = a[i] || {};
    const ev = (x.ev || []).map(k => { const q = qs.find(q => q.i === k); return q ? '第五章回饋：' + (q.who || '') + '（' + (q.where || '') + '）「' + q.said + '」' : ''; }).filter(Boolean);
    return '想證明的事 ' + (i + 1) + '：' + p + '\n  結果：' + (x.r || '（未選）') + '\n  證據：' + (ev.join('；') || '（未選）') + (x.note ? '\n  補充：' + x.note : '');

}

/* ===================== 7. 貼回解析：拆成「本章正文」與「欄位更新」 ===================== */
function cleanBody(t){
  return String(t || '').replace(/\*\*/g, '').replace(/^#{1,6}\s*/gm, '').replace(/^\s*```.*$/gm, '').replace(/\n{3,}/g, '\n\n').trim();
}
function norm(s){ return String(s || '').replace(/（[^）]*）/g, '').replace(/[\s【】：:]/g, ''); }
function matchField(c, name){
  const n = norm(name); if (n.length < 2) return null;
  const pool = allFields(c).filter(f => f.upd);
  return pool.find(f => norm(label(f)) === n) || pool.find(f => { const l = norm(label(f)); return l.includes(n) || n.includes(l); }) || null;
}
function parseBack(text, c){
  const t = String(text || '').replace(/\r/g, '').replace(/^\s*```[^\n]*$/gm, '');
  const mB = '===本章正文===', mU = '===欄位更新===', mE = '===END===';
  const iB = t.indexOf(mB), iU = t.indexOf(mU), iE = t.indexOf(mE);
  let body = '', upd = '';
  if (iB >= 0) body = t.slice(iB + mB.length, iU > iB ? iU : (iE > iB ? iE : t.length));
  if (iU >= 0) upd = t.slice(iU + mU.length, iE > iU ? iE : t.length);
  const noMark = iB < 0 && iU < 0;
  if (noMark){ if (/^\s*【[^】]+】\s*[：:]/m.test(t) && c.type !== 'write') upd = t; else body = t; }
  const ups = [];
  let curU = null;
  upd.split('\n').forEach(line => {
    const m = line.match(/^\s*[-・•*]?\s*【([^】]+)】\s*[：:]\s*(.*)$/);
    if (m){ curU = { name:m[1].trim(), text:m[2] }; ups.push(curU); }
    else if (curU) curU.text += '\n' + line;
  });
  const out = ups.map(u => { const f = matchField(c, u.name); return { name:u.name, id:f ? f.id : null, text:u.text.replace(/^\n+|\s+$/g, ''), st:'pending' }; }).filter(u => u.text && !/^（?無）?$/.test(u.text));
  return { body:cleanBody(body), ups:out, noMark };
}
// 欄位更新寫入：文字欄直接取代；表格欄解析「｜」分隔的行
function applyUpdate(u){
  const f = F(u.id); if (!f) return;
  if (f.kind === 'table'){
    const heads = f.cols.map(x => x.n.replace(/\s/g, ''));
    const rows = u.text.split('\n').map(l => l.replace(/^\s*[-・•*\d.、]+\s*/, '').trim()).filter(l => /[｜|]/.test(l) && !/^[\s|｜:-]+$/.test(l))
      .map(l => l.replace(/^[|｜]|[|｜]$/g, '').split(/[｜|]/).map(x => x.trim()))
      .filter(r => !(r[0] && heads.includes(r[0].replace(/\s/g, ''))));
    if (rows.length) state.values[f.id] = rows.map(r => f.cols.map((_, i) => r[i] ?? ''));
  } else state.values[f.id] = u.text.trim();
}

/* ===================== 8. 定稿檢查（背景執行） ===================== */
const HYPE = ['完美','極度','極致','革命性','前所未有','顛覆','無與倫比','史上','最強','非常非常','無可挑剔'];
function finalCheck(c){
  const b = String(state.body[c.id] || ''), block = [], warn = [];
  if (!b.trim()){ block.push('還沒有本章正文。'); return { block, warn }; }
  const todo = [...b.matchAll(/【待補[：:]?([^】]*)】/g)].map(m => m[1].trim() || '（未註明）');
  if (todo.length) block.push('正文還有 ' + todo.length + ' 處【待補】：' + [...new Set(todo)].slice(0, 6).join('、') + '。把資料補進上面「我的內容」，再重新產生正文；或直接在正文裡補上並刪掉【待補】標記。');
  const bad = [...b.matchAll(/資料\s*(\d+)/g)].map(m => +m[1]).filter(n => !state.srcs[n - 1]);
  if (bad.length) block.push('正文引用了不存在的資料編號：' + [...new Set(bad)].map(n => '資料' + n).join('、') + '。可能是 AI 捏造的，請刪除或改成「我參考的資料」裡真的有的編號。');
  const n = b.replace(/\s/g, '').length, [lo, hi] = c.words;
  if (n < lo * 0.8 || n > hi * 1.25) warn.push('字數約 ' + n + ' 字，建議範圍 ' + lo + '～' + hi + ' 字。');
  const hy = HYPE.filter(w => b.includes(w));
  if (hy.length) warn.push('出現誇大用詞：' + hy.join('、') + '。報告要用平實的說法。');
  const wn = workRows().map(r => String(r[0]).trim());
  const fake = c.id === 'c2' ? [] : [...b.matchAll(/[^（）\s，。、；：「」]{1,12}（(?:19|20)\d{2}[^）]{0,8}）|（[^）]{1,30}[，,]\s*(?:19|20)\d{2}）/g)].map(m => m[0]).filter(m => !wn.some(w => m.includes(w)));
  if (fake.length) warn.push('疑似 AI 自己加的引用：' + [...new Set(fake)].slice(0, 3).join('、') + '。引用只能寫（資料編號），請確認這些資料真的存在。');
  if (c.id.match(/c[345]/)){
    const ok = figList(c.id).map(f => f.no);
    const figs = [...b.matchAll(/圖\s*(\d+-\d+-\d+)/g)].map(m => '圖' + m[1]).filter(x => !ok.includes(x));
    if (figs.length) warn.push('正文用了圖表清單沒有的圖號：' + [...new Set(figs)].join('、') + '。');
  }
  if (c.id === 'c5'){ const q = quoteRows(); if (q.length < 3 || !q.some(x => x.pn === '負面')) warn.push('回饋少於 3 則，或沒有負面回饋。'); }
  if (state.srcs.length + workRows().length < 5 && (c.id === 'c1' || c.id === 'c2')) warn.push('「我參考的資料」加參考作品還不到 5 筆。');
  if (!state.read[c.id]) warn.push('還沒有勾選「每一段我都讀過、改過」。');
  return { block, warn };
}

    .replace('<w:t>指導老師：</w:t>', '<w:t>' + xesc('指導老師：' + (val('advisor') || '')) + '</w:t>');
  const iY = doc.indexOf('中華民國');
  if (iY > 0){ let tail = doc.slice(iY); tail = tail.replace('<w:t xml:space="preserve">  </w:t>', '<w:t xml:space="preserve"> ' + (d.getFullYear() - 1911) + ' </w:t>').replace('<w:t xml:space="preserve">  </w:t>', '<w:t xml:space="preserve"> ' + (d.getMonth() + 1) + ' </w:t>'); doc = doc.slice(0, iY) + tail; }
  const bs = doc.indexOf('<w:body>') + 8, be = doc.lastIndexOf('</w:body>');
  const ch = topChunks(doc.slice(bs, be));
  const find = (pred, from = 0) => { for (let i = from; i < ch.length; i++) if (pred(ch[i])) return i; return -1; };
  // 封面：組員一人一行、主題太長會換行，拿掉等量的空白段落，避免日期被擠到下一頁
  const iT = find(x => chunkText(x).startsWith('主題：')), iS = find(x => /<w:br\/>|學號|專題學生/.test(chunkText(x) + x), iT + 1);
  let extra = memList.length - 1 + Math.floor(('主題：' + (val('title') || '')).length / 20);
  for (let i = iS - 1; i > iT && extra > 0; i--) if (!chunkText(ch[i]).trim() && !/<w:sectPr|<w:r>/.test(ch[i]) && /<w:p\b/.test(ch[i])){ ch[i] = ''; extra--; }
  // 摘要：替換標題後的空白段落
  const ab = absParts(), iAbs = find(x => chunkText(x).trim() === '摘要' && /w:val="2"/.test(x));
  if (iAbs >= 0) ch[iAbs + 1] = (ab.abs ? ab.abs.split(/\n+/).map(pBody).join('') : pNote('（尚未產生摘要：到工具的「報告預覽」複製摘要提示詞）')) +
    (ab.kw ? P(run('關鍵字：', { b:true }) + run(ab.kw), '<w:pStyle w:val="a3"/><w:spacing w:before="240"/>') : '');
  // 目錄：移除範本的靜態目錄，改成 Word 目錄欄位（開檔時更新）
  const iToc = find(x => chunkText(x).replace(/\s/g, '') === '目錄'), iTab = find(x => chunkText(x).trim() === '表目錄', iToc + 1);
  const tocField = P('<w:r><w:fldChar w:fldCharType="begin" w:dirty="true"/></w:r><w:r><w:instrText xml:space="preserve"> TOC \\o "2-3" \\h \\z \\u </w:instrText></w:r><w:r><w:fldChar w:fldCharType="separate"/></w:r>' + run('（目錄：開啟檔案時選「是」更新欄位；或在這裡按右鍵 →「更新功能變數」）', { color:'808080' }) + '<w:r><w:fldChar w:fldCharType="end"/></w:r>', '<w:pStyle w:val="a3"/>');
  let first = -1;
  for (let i = iToc + 1; i < iTab; i++) if (/w:pStyle w:val="(10|20|30|4|5|6)"/.test(ch[i]) && !/<w:sectPr/.test(ch[i])){ if (first < 0){ ch[i] = tocField; first = i; } else ch[i] = ''; }
  // 正文：從第一章標題到最後，換成產生的內容
  const iC1 = find(x => /第一章/.test(chunkText(x)) && /w:val="2"/.test(x), iTab);
  const tail = ch.slice(-1)[0];
  const tables = [];
  const body = ['c1','c2','c3','c4','c5','c6'].map(id => chapterXML(chap(id), tables)).join('') +
    pH2('參考文獻', true) + (refsAll().length ? refsAll().map(r => P(run(r), '<w:pStyle w:val="a3"/><w:spacing w:line="360" w:lineRule="auto"/><w:ind w:left="480" w:hanging="480"/>')).join('') : pNote('（還沒有參考資料）'));
  // 表目錄、圖目錄：插在標題之後
  const iFigH = find(x => chunkText(x).trim() === '圖目錄', iTab + 1);
  const figs = ['c3','c4','c5'].flatMap(figList);
  const listP = t => P(run(t), '<w:pStyle w:val="a3"/><w:spacing w:line="360" w:lineRule="auto"/>');
  ch[iTab] += tables.length ? tables.map(t => listP(t.no + '　' + t.name)).join('') : pNote('（沒有表格）');
  if (iFigH >= 0) ch[iFigH] += figs.length ? figs.map(f => listP(f.no + '　' + f.name)).join('') : pNote('（沒有圖）');
  const out = ch.slice(0, iC1).join('') + body + (/<w:sectPr/.test(tail) && !/<w:p\b/.test(tail) ? tail : '');
  doc = doc.slice(0, bs) + out + doc.slice(be);
  // 開檔時自動更新目錄欄位
  let set = dec.decode(b64bytes(TPL['word/settings.xml']));
  if (!/w:updateFields/.test(set)) set = set.replace(/(<w:settings\b[^>]*>)/, '$1<w:updateFields w:val="true"/>');
  const files = Object.keys(TPL).map(name => ({ name, data:name === 'word/document.xml' ? enc.encode(doc) : name === 'word/settings.xml' ? enc.encode(set) : b64bytes(TPL[name]) }));
  files.sort((a, b) => (a.name === '[Content_Types].xml' ? -1 : b.name === '[Content_Types].xml' ? 1 : 0));
  return zip(files);
}
function alertBox(m){ const t = $('#tst-all'); if (t) t.textContent = m; }
function downloadDocx(){
  const blob = buildDocx(), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = '專題報告_' + (val('title') || '未命名') + '_' + today() + '.docx'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ===================== 15. 互動 ===================== */
function refreshLight(){ // 輸入時不重繪表單，只更新導覽與進度
  renderNav();
  const c = chap(cur); const sb = $('#stripBox'); if (c && sb) sb.innerHTML = stripHTML(c);
  $('#projName').textContent = val('title') || '專題報告引導器';
}
function logUse(ch, kind){ state.log.push({ t:new Date().toLocaleString('zh-TW', {hour12:false}), ch, kind }); save(); }
async function copyText(text, el, ok){
  try { await navigator.clipboard.writeText(text); if (el) el.textContent = ok; }
  catch(e){ // 剪貼簿被擋：放進可選取的框
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); if (el) el.textContent = ok; } catch(_){ if (el) el.textContent = '無法自動複製，請按「預覽提示詞」手動選取'; }
    ta.remove();
  }
  if (el) setTimeout(() => { el.textContent = ''; }, 3000);
}
// 套用 AI 欄位更新後，正文本來就包含這些新內容，不算「欄位改過」
function resig(c){ if (String(state.body[c.id] || '').trim()) state.bodySig[c.id] = sig(c); }
function jumpTo(id){
  const w = document.getElementById('w-' + id); if (!w) return;
  w.scrollIntoView({ block:'center', behavior:'smooth' });
  w.classList.remove('flash'); void w.offsetWidth; w.classList.add('flash');
  const inp = w.querySelector('textarea,input,select'); if (inp && id !== 'steps') setTimeout(() => inp.focus({ preventScroll:true }), 400);
}
function rerenderKeepFocus(){
  const a = document.activeElement, id = a && a.id, pos = a && a.selectionStart, y = window.scrollY;
  renderAll(); window.scrollTo(0, y);
  const el = id && document.getElementById(id);
  if (el){ el.focus({ preventScroll:true }); try { if (pos != null) el.setSelectionRange(pos, pos); } catch(_){} }
}
document.addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if (d.tag !== undefined) return; // 勾選另外處理
  if (d.raw){ state.raw[d.raw] = el.value; save(); return; }
  if (d.body){ state.body[d.body] = el.value; save(); const n = $('#wc-' + d.body); if (n) n.textContent = '約 ' + el.value.replace(/\s/g, '').length + ' 字'; return; }
  if (d.abs){ state.abs = el.value; save(); return; }
  if (d.src !== undefined){ state.srcs[+d.src][d.k] = el.value; save(); const ce = $('#cite-' + d.src); if (ce) ce.innerHTML = '<b>自動產生的參考文獻：</b>' + esc(citeOf(state.srcs[+d.src])); renderNav(); return; }
  if (d.ans !== undefined && d.k){ const a = state.values.answers = state.values.answers || []; a[+d.ans] = a[+d.ans] || {}; a[+d.ans][d.k] = el.value; save(); refreshLight(); return; }
  if (d.f && d.r !== undefined){ state.values[d.f][+d.r][+d.c] = el.value; }
  else if (d.f){ state.values[d.f] = el.value; }
  else return;
  save(); refreshLight();
});
document.addEventListener('change', e => {
  const el = e.target, d = el.dataset;
  if (d.tag !== undefined){ // 勾選：表格儲存格或整欄
    const toggle = (s, t, on) => { const a = String(s || '').split('、').filter(Boolean).filter(x => x !== t); if (on) a.push(t); return a.join('、'); };
    if (d.tagf) state.values[d.tagf] = toggle(val(d.tagf), d.tag, el.checked);
    else state.values[d.f][+d.r][+d.c] = toggle(state.values[d.f][+d.r][+d.c], d.tag, el.checked);
    save(); refreshLight(); return;
  }
  if (d.ev !== undefined){ const a = state.values.answers = state.values.answers || []; const x = a[+d.ans] = a[+d.ans] || {}; x.ev = (x.ev || []).filter(k => k !== +d.ev); if (el.checked) x.ev.push(+d.ev); save(); return; }
  if (d.read){ state.read[d.read] = el.checked; save(); return; }
  if (d.f === 'group' || d.f === 'sub' || d.f === 'vis' || (d.f && d.f.startsWith('figs_') && el.tagName === 'SELECT')) { setTimeout(rerenderKeepFocus, 0); }
});
let armed = null;
function armNew(btn){
  if (armed === btn){ state = blank(); cur = 'c0'; save(); renderAll(); armed = null; btn.textContent = btn.dataset.orig; return; }
  armed = btn; btn.dataset.orig = btn.dataset.orig || btn.textContent; btn.textContent = '再按一次確認清空';
  setTimeout(() => { if (armed === btn){ btn.textContent = btn.dataset.orig; armed = null; } }, 3000);
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.nav){ cur = d.nav; chkResult = {}; try { localStorage.setItem(KEY + ':cur', cur); } catch(_){} renderAll(); window.scrollTo({ top:0 }); return; }
  if (d.jump){ jumpTo(d.jump); return; }
  if (d.add){ const f = F(d.add), n = f.kind === 'figs' ? 3 : f.cols.length; state.values[f.id].push(Array(n).fill('')); save(); rerenderKeepFocus(); return; }
  if (d.del){ const a = state.values[d.del]; a.splice(+d.r, 1); if (!a.length) a.push([]); save(); rerenderKeepFocus(); return; }
  if (d.toggle){ showPrompt[d.toggle] = !showPrompt[d.toggle]; rerenderKeepFocus(); return; }
  if (d.copy){ const c = chap(d.copy); if (gate(c).miss.length) return; logUse(chName(c), c.type === 'pos' ? '專題定位問答' : c.type === 'grill' ? '問答＋撰寫正文' : '撰寫正文'); copyText(promptFor(c), $('#tst-' + c.id), '已複製，貼到 ChatGPT 或 Gemini'); return; }
  if (d.copyvis){ logUse('第四章 專題製作說明', '視覺規範書擷取'); copyText(visPrompt(), $('#tst-vis'), '已複製'); return; }
  if (d.parse){
    const c = chap(d.parse), raw = state.raw[c.id] || '', msg = $('#pmsg-' + c.id);
    if (!raw.trim()){ msg.textContent = '框裡沒有內容'; return; }
    const r = parseBack(raw, c);
    if (c.type !== 'pos' && r.body){ state.body[c.id] = r.body; state.bodySig[c.id] = sig(c); state.final[c.id] = false; }
    state.ups[c.id] = r.ups;
    if (c.type === 'pos') r.ups.forEach(u => { if (u.id){ applyUpdate(u); u.st = 'applied'; } }); // 定位：直接填入
    save(); renderAll();
    const m = $('#pmsg-' + c.id);
    if (m) m.textContent = (r.body && c.type !== 'pos' ? '已讀取本章正文。' : '') + (r.ups.length ? '讀到 ' + r.ups.length + ' 項欄位更新。' : '') + (!r.body && !r.ups.length ? '沒有讀到內容，請確認貼的是 AI 最後那段結果（含 ===本章正文=== 或 ===欄位更新===）。' : '') + (r.noMark && r.body ? '（沒有看到 ===本章正文=== 標記，已把整段當作正文，請檢查）' : '');
    jumpTo('steps'); return;
  }
  if (d.up !== undefined){ const c = chap(cur), u = state.ups[c.id][+d.up]; if (d.op === 'applied') applyUpdate(u); u.st = d.op; resig(c); save(); rerenderKeepFocus(); return; }
  if (d.upall){ const c = chap(cur); state.ups[c.id].forEach(u => { if (u.st === 'pending' && u.id){ applyUpdate(u); u.st = 'applied'; } }); resig(c); save(); rerenderKeepFocus(); return; }
  if (d.final){
    const c = chap(d.final);
    if (state.final[c.id]){ state.final[c.id] = false; chkResult[c.id] = null; save(); rerenderKeepFocus(); return; }
    const r = finalCheck(c); chkResult[c.id] = r;
    if (!r.block.length && !r.warn.length){ state.final[c.id] = true; chkResult[c.id] = null; }
    save(); rerenderKeepFocus(); return;
  }
  if (d.forcefinal){ state.final[d.forcefinal] = true; chkResult[d.forcefinal] = null; save(); rerenderKeepFocus(); return; }
  if (d.addref){ const r = TEACHER_REFS[d.addref][+d.i]; if (!state.srcs.some(s => s.url === r.url)) state.srcs.push({ lv:r.lv, cite:r.cite, author:r.author, year:r.year, url:r.url, said:r.note, quote:'', rel:'' }); save(); rerenderKeepFocus(); return; }
  if (d.newsrc){ state.srcs.push({ lv:'B', author:'', date:'', title:'', place:'', pub:'', url:'', retr:today(), said:'', quote:'', rel:'' }); save(); renderAll(); return; }
  if (d.delsrc !== undefined){ if (b.dataset.armed){ state.srcs.splice(+d.delsrc, 1); save(); renderAll(); } else { b.dataset.armed = 1; b.textContent = '再按一次確認刪除（之後的資料編號會往前移）'; } return; }
  if (d.copyabs){ logUse('摘要', '摘要與關鍵字'); copyText(absPrompt(), $('#tst-abs'), '已複製'); return; }
  if (d.docx){ try { downloadDocx(); logUse('報告預覽', '下載 Word 檔'); } catch(err){ alertBox('Word 檔產生失敗：' + err.message); } return; }
  if (d.copyall){ copyText(fullText(), $('#tst-all'), '已複製全文'); return; }
  if (d.copyrefs){ copyText(refsAll().join('\n'), $('#tst-all'), '已複製參考文獻'); return; }
  if (d.copylog){ copyText('| 時間 | 章節 | 用途 |\n|---|---|---|\n' + state.log.map(l => '| ' + l.t + ' | ' + l.ch + ' | ' + l.kind + ' |').join('\n'), $('#tst-log'), '已複製'); return; }
  if (b.id === 'btnNew' || b.id === 'btnNew2'){ armNew(b); return; }
  if (b.id === 'btnSample'){
    if (!state.isSample && (val('title') || state.srcs.length) && !b.dataset.armed){ b.dataset.armed = 1; b.textContent = '會取代目前資料，請先匯出備份；再按一次載入'; setTimeout(() => { b.textContent = '看完整範例'; delete b.dataset.armed; }, 4000); return; }
    const log = state.log; state = Object.assign(blank(), clone(SAMPLE)); fix(); state.log = log || []; cur = 'pos'; save(); renderAll(); window.scrollTo({ top:0 }); return;
  }
  if (b.id === 'btnData'){ $('#exportBox').value = JSON.stringify(state, null, 2); $('#importMsg').textContent = ''; $('#modal').hidden = false; return; }
  if (b.id === 'btnClose'){ $('#modal').hidden = true; return; }
  if (b.id === 'btnCopyJson'){ copyText($('#exportBox').value, $('#jsonToast'), '已複製 JSON'); return; }
  if (b.id === 'btnDlJson'){ const blob = new Blob([$('#exportBox').value], { type:'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (val('title') || '專題報告') + '_' + today() + '.json'; a.click(); return; }
  if (b.id === 'btnImport'){
    try { const o = JSON.parse($('#importBox').value); if (!o || typeof o.values !== 'object') throw 0; state = o; fix(); save(); renderAll(); $('#importMsg').textContent = '匯入完成'; $('#importBox').value = ''; }
    catch(_){ $('#importMsg').textContent = '格式不正確：請貼上本工具匯出的完整 JSON'; }
  }
});
$('#importFile').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#importBox').value = r.result; $('#importMsg').textContent = '已讀入檔案，按「匯入」套用'; }; r.readAsText(f); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') $('#modal').hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#modal').hidden = true; });

/* ===================== 16. 啟動 ===================== */
// 嵌在 claude.ai 預覽時，下載與列印會被擋，只在獨立網頁顯示
let inFrame = true; try { inFrame = window.self !== window.top; } catch(_){}
$('#btnDlJson').hidden = inFrame;
document.documentElement.classList.toggle('framed', inFrame);
load(); renderAll();
</script>
